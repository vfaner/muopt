    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2311998e'/%3E%3Cstop offset='1' stop-color='%2338ef7d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='8' y='10' width='48' height='44' rx='6' fill='url(%23g)'/%3E%3Cpath d='M18 40 L28 28 L36 34 L46 20' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <script src="/libs/axios.min.js"></script>
    <script src="/page-state.js"></script>

    <script src="/auth.js"></script>
</head>
<body>

        <!-- 移动端汉堡菜单按钮（z-index 高于菜单与遮罩，展开后仍可点击关闭） -->
        <div id="mobileMenuBar" style="display:none;justify-content:space-between;align-items:center;width:100%;background:#0f2027;color:white;padding:12px;position:fixed;top:0;left:0;right:0;z-index:1002;">
            <div style="font-weight:bold;">MuOpt - SQL优化与信创转换</div>
            <button id="mobileMenuBtn" style="background:none;border:1px solid rgba(255,255,255,0.2);color:white;padding:8px 12px;border-radius:6px;margin-left:auto;">
                ☰ 菜单
            </button>
        </div>

        <!-- 移动端遮罩层 -->
        <div id="menuOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;"></div>

        <!-- 左侧菜单 - 完整，不会消失 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>MuOpt <span style="font-size:14px;font-weight:normal;">v1.1.0</span></h1>
                <p>沐优 - SQL优化与信创转换</p>
            </div>
            <nav class="menu">
                <div class="menu-group" data-group="optimize">
                    <div class="menu-group-title">
                        <span class="menu-icon">🚀</span><span>SQL 优化</span>
                        <span class="menu-group-arrow">▾</span>
                    </div>
                    <div class="menu-group-items">
                        <a href="/manual.html" class="menu-item">
                            <span class="menu-icon">✏️</span><span>手工优化</span>
                        </a>
                        <a href="/auto.html" class="menu-item">
                            <span class="menu-icon">🔍</span><span>扫描优化</span>
                        </a>
                    </div>
                </div>
                <div class="menu-group" data-group="convert">
                    <div class="menu-group-title">
                        <span class="menu-icon">🔄</span><span>SQL 转换</span>
                        <span class="menu-group-arrow">▾</span>
                    </div>
                    <div class="menu-group-items">
                        <a href="/convert-manual.html" class="menu-item">
                            <span class="menu-icon">✏️</span><span>手工转换</span>
                        </a>
                        <a href="/convert-auto.html" class="menu-item">
                            <span class="menu-icon">🔍</span><span>扫描转换</span>
                        </a>
                    </div>
                </div>
                <a href="/explain.html" class="menu-item active">
                    <span class="menu-icon">📊</span><span>SQL执行计划</span>
                </a>
                <a href="/datasource.html" class="menu-item">
                    <span class="menu-icon">🔗</span><span>数据源配置</span>
                </a>
                <a href="/ai.html" class="menu-item">
                    <span class="menu-icon">🤖</span><span>AI模型配置</span>
                </a>
                <a href="/about.html" class="menu-item">
                    <span class="menu-icon">ℹ️</span><span>关于我们</span>
                </a>
                <a href="/profile.html" class="menu-item">
                    <span class="menu-icon">⚙️</span><span>个人中心</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-chip">
                    <span class="user-avatar">👤</span>
                    <div class="user-chip-info">
                        <div class="user-nickname" data-user-nickname>加载中…</div>
                        <div class="user-account" data-user-account></div>
                    </div>
                </div>
                <a href="javascript:;" class="logout-link js-logout">🚪 退出登录</a>
            </div>
        </aside>
        <div class="app-container">

            <main class="main-content">
                <div class="page-header">
                    <h2>SQL执行计划</h2>
                    <p>连接数据源后执行 EXPLAIN，展示执行计划明细并评估成本</p>
                </div>

                <!-- 未配置数据源提示 -->
                <div v-if="!dsConnected" class="content-card">
                    <div class="empty-state">
                        <div class="empty-icon">🔒</div>
                        <div style="font-size:16px;color:#666;margin-bottom:8px;">未配置数据源</div>
                        <div style="color:#999;margin-bottom:20px;">执行计划分析需要连接真实数据库，请先配置数据源再进行使用</div>
                        <el-button type="primary" @click="goDataSource">🔗 前往配置数据源</el-button>
                    </div>
                </div>

                <!-- 已配置：执行计划分析 -->
                <template v-else>
                    <div class="ds-banner connected">
                        <span>✅</span>
                        <span>已连接数据源（{{ dsInfo }}），可执行 EXPLAIN 分析</span>
                    </div>

                    <div class="content-card">
                        <div class="form-section">
                            <div class="form-section-title">查询 SQL</div>
                            <el-input
                                v-model="sql"
                                type="textarea"
                                :rows="8"
                                placeholder="输入要分析执行计划的 SELECT 查询，例如：&#10;SELECT * FROM orders WHERE status = 1 AND create_time > '2024-01-01';"
                            ></el-input>
                        </div>
                        <div class="button-group">
                            <el-button type="primary" size="large" @click="doExplain" :loading="loading">
                                📊 分析执行计划
                            </el-button>
                            <el-button size="large" @click="clearAll">清空</el-button>
                        </div>
                    </div>

                    <!-- 执行计划结果 -->
                    <div v-if="result" class="content-card">
                        <div v-if="restoredAt" style="font-size:12px;color:#999;margin-bottom:10px;">
                            🕓 已保留上次执行计划结果（{{ savedAtText }}），重新点击「分析执行计划」可刷新
                        </div>
                        <!-- 成本概览 -->
                        <div class="form-section-title">成本评估</div>
                        <div style="display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;">
                            <div class="stat-box" :class="'cost-' + (result.costLevel || 'unknown').toLowerCase()">
                                <div class="stat-label">成本等级</div>
                                <div class="stat-value">{{ costLevelText(result.costLevel) }}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">估算成本</div>
                                <div class="stat-value">{{ result.totalCost != null ? result.totalCost.toFixed(2) : '—' }}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">预估扫描行数</div>
                                <div class="stat-value">{{ result.estimatedRows != null ? result.estimatedRows : '—' }}</div>
                            </div>
                        </div>

                        <!-- 执行计划明细：表格 / 树形 / 图形（类 DBeaver） -->
                        <div class="form-section-title">执行计划明细</div>
                        <el-tabs v-model="activeTab" type="border-card" style="margin-bottom:20px;">
                            <!-- 表格视图（默认）：结构化列 Operation/Object/Rows/Cost/Node Type -->
                            <el-tab-pane label="📋 表格" name="table">
                                <!-- 有结构化树：展示 DBeaver 式的列 -->
                                <el-table v-if="hasTree" :data="planRows" border stripe style="width:100%;" max-height="440" row-key="id">
                                    <el-table-column label="Operation" min-width="360" show-overflow-tooltip>
                                        <template #default="{ row }">
                                            <span :style="{ paddingLeft: (row.depth * 18) + 'px' }" style="font-family:'Consolas','Monaco',monospace;">
                                                <span v-if="row.depth > 0" style="color:#bbb;">└─ </span>
                                                <span class="node-badge" :class="'op-' + (row.kind || 'op')">{{ row.nodeType }}</span>
                                                <span style="color:#555;">{{ row.operation }}</span>
                                            </span>
                                        </template>
                                    </el-table-column>
                                    <el-table-column prop="object" label="Object" min-width="130" show-overflow-tooltip></el-table-column>
                                    <el-table-column prop="rows" label="Rows" width="90" align="right"></el-table-column>
                                    <el-table-column prop="cost" label="Cost" width="100" align="right"></el-table-column>
                                    <el-table-column label="Node Type" width="130">
                                        <template #default="{ row }">
                                            <span class="node-badge" :class="'op-' + (row.kind || 'op')">{{ row.nodeType }}</span>
                                        </template>
                                    </el-table-column>
                                </el-table>
                                <!-- 无结构化树（其他数据库）：回退为原始列 -->
                                <el-table v-else :data="tableData" border stripe style="width:100%;" max-height="440">
                                    <el-table-column
                                        v-for="h in result.headers"
                                        :key="h"
                                        :prop="h"
                                        :label="h"
                                        min-width="120"
                                        show-overflow-tooltip
                                    ></el-table-column>
                                </el-table>
                            </el-tab-pane>

                            <!-- 树形视图 -->
                            <el-tab-pane label="🌲 树形" name="tree">
                                <el-tree
                                    v-if="hasTree"
                                    :data="planTree"
                                    :props="{ children: 'children', label: 'label' }"
                                    default-expand-all
                                    :expand-on-click-node="false"
                                    node-key="id"
                                    class="plan-tree"
                                >
                                    <template #default="{ data }">
                                        <span class="tree-node-label" :class="'op-' + (data.kind || 'detail')">
                                            <span v-if="data.op" class="tree-op">{{ data.op }}</span>
                                            <span>{{ data.text }}</span>
                                            <span v-if="data.metric" class="tree-metric">{{ data.metric }}</span>
                                        </span>
                                    </template>
                                </el-tree>
                                <div v-else class="empty-state" style="padding:24px;color:#999;">
                                    当前数据库未返回结构化执行计划树，请查看「表格」视图。
                                </div>
                            </el-tab-pane>

                            <!-- 图形视图 -->
                            <el-tab-pane label="🗺️ 图形" name="diagram">
                                <div v-if="hasTree" class="plan-diagram">
                                    <div
                                        v-for="n in flatNodes"
                                        :key="n.id"
                                        class="diagram-row"
                                        :style="{ marginLeft: (n.depth * 34) + 'px' }"
                                    >
                                        <span v-if="n.depth > 0" class="diagram-connector"></span>
                                        <div class="diagram-node" :class="'op-' + (n.kind || 'detail')">
                                            <div class="diagram-node-title">
                                                <span v-if="n.op" class="diagram-op">{{ n.op }}</span>
                                                <span>{{ n.text }}</span>
                                            </div>
                                            <div v-if="n.metric" class="diagram-node-metric">{{ n.metric }}</div>
                                        </div>
                                    </div>
                                </div>
                                <div v-else class="empty-state" style="padding:24px;color:#999;">
                                    当前数据库未返回结构化执行计划树，请查看「表格」视图。
                                </div>
                            </el-tab-pane>

                            <!-- 原始输出（调试用） -->
                            <el-tab-pane label="🔧 原始输出" name="raw">
                                <div style="font-size:12px;color:#999;margin-bottom:8px;">
                                    数据库类型：{{ result.dbType || '未知' }} · 表头列数：{{ result.headers ? result.headers.length : 0 }}
                                    <el-button size="small" text @click="copyText(rawDump)" style="margin-left:8px;">📋 复制全部</el-button>
                                </div>
                                <div class="result-content" style="max-height:460px;white-space:pre-wrap;">{{ rawDump }}</div>
                            </el-tab-pane>
                        </el-tabs>

                        <!-- 索引建议（仅高成本时给出） -->
                        <div v-if="result.indexSuggestions && result.indexSuggestions.length > 0" class="form-section">
                            <div class="form-section-title">索引建议</div>
                            <div class="legend">
                                <span><span class="dot orange"></span>建议创建</span>
                                <span><span class="dot gray"></span>已存在</span>
                            </div>
                            <div v-for="(idx, i) in result.indexSuggestions" :key="i" class="index-card">
                                <div class="index-card-header">
                                    <span class="index-meta">
                                        📌 表 <strong>{{ idx.tableName }}</strong> · 列（{{ idx.columns.join(', ') }}）— {{ idx.reason }}
                                        <span class="index-tag" :class="idx.status.toLowerCase()">{{ tagText(idx.status) }}</span>
                                    </span>
                                    <el-button v-if="idx.status !== 'EXISTS'" size="small" text @click="copyText(idx.createSql)">📋 复制</el-button>
                                </div>
                                <div class="index-sql" :class="idx.status.toLowerCase()">{{ idx.createSql }}</div>
                            </div>
                        </div>

                        <!-- 分析结论 -->
                        <ul v-if="result.tips && result.tips.length > 0" class="tips-list">
                            <li v-for="(tip, i) in result.tips" :key="i">{{ tip }}</li>
                        </ul>
                    </div>
                </template>
            </main>
        </div>
    </div>

    <style>
        .stat-box {
            flex: 1;
            min-width: 140px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 16px 20px;
            border: 1px solid #eee;
        }
        .stat-label { font-size: 12px; color: #999; margin-bottom: 6px; }
        .stat-value { font-size: 22px; font-weight: 700; color: #333; }
        .cost-high { background: #fff2f0; border-color: #ffccc7; }
        .cost-high .stat-value { color: #cf1322; }
        .cost-medium { background: #fffbe6; border-color: #ffe58f; }
        .cost-medium .stat-value { color: #d48806; }
        .cost-low { background: #f6ffed; border-color: #b7eb8f; }

        /* 表格视图：Node Type 彩色标签 */
        .node-badge {

            font-family: 'Consolas','Monaco',monospace;

        }
        .op-scan-full.node-badge { background: #fff1f0; color: #cf1322; }
        .op-index.node-badge { background: #f6ffed; color: #389e0d; }
        .op-scan.node-badge { background: #fffbe6; color: #d48806; }
        .op-join.node-badge { background: #f9f0ff; color: #531dab; }
        .op-sort.node-badge { background: #e6fffb; color: #08979c; }
        .op-agg.node-badge { background: #fff0f6; color: #c41d7f; }
        .op-detail.node-badge { background: #f0f0f0; color: #999; }

        /* 树形视图 */
        .plan-tree { padding: 8px 4px; }
        .tree-node-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
        .tree-op {
            font-weight: 700; font-family: 'Consolas','Monaco',monospace;
            padding: 1px 8px; border-radius: 6px; font-size: 12px;
            background: #e6f4ff; color: #0958d9;
        }
        .tree-metric { color: #999; font-family: 'Consolas','Monaco',monospace; font-size: 12px; }
        /* 明细节点弱化显示 */
        .op-detail .tree-op { background: #f0f0f0; color: #999; }
        .op-detail { color: #888; }

        /* 图形视图（类 DBeaver 计划节点树） */
        .plan-diagram { padding: 10px 4px; overflow-x: auto; }
        .diagram-row { position: relative; margin-bottom: 10px; }
        .diagram-connector {
            position: absolute; left: -18px; top: 50%; width: 18px; height: 2px;
            background: #cfd8dc;
        }
        .diagram-node {
            display: inline-block; min-width: 220px; max-width: 620px;
            border: 1px solid #d9e1e8; border-left-width: 4px; border-radius: 10px;
            padding: 10px 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            vertical-align: middle;
        }
        .diagram-node-title { font-size: 13px; color: #333; display: flex; align-items: center; gap: 8px; }
        .diagram-op {
            font-weight: 700; font-family: 'Consolas','Monaco',monospace; font-size: 12px;
            padding: 1px 8px; border-radius: 6px; background: #e6f4ff; color: #0958d9;
        }
        .diagram-node-metric {
            margin-top: 6px; font-size: 12px; color: #8a9299;
            font-family: 'Consolas','Monaco',monospace;
        }

        /* 节点类别配色（树形 op 标签 + 图形左边框） */
        .op-scan-full { border-left-color: #ff4d4f; }
        .op-scan-full .tree-op, .op-scan-full .diagram-op { background: #fff1f0; color: #cf1322; }
        .op-index { border-left-color: #52c41a; }
        .op-index .tree-op, .op-index .diagram-op { background: #f6ffed; color: #389e0d; }
        .op-scan { border-left-color: #faad14; }
        .op-scan .tree-op, .op-scan .diagram-op { background: #fffbe6; color: #d48806; }
        .op-join { border-left-color: #722ed1; }
        .op-join .tree-op, .op-join .diagram-op { background: #f9f0ff; color: #531dab; }
        .op-sort { border-left-color: #13c2c2; }
        .op-sort .tree-op, .op-sort .diagram-op { background: #e6fffb; color: #08979c; }
        .op-agg { border-left-color: #eb2f96; }
        .op-agg .tree-op, .op-agg .diagram-op { background: #fff0f6; color: #c41d7f; }
        .op-op { border-left-color: #1677ff; }
        .op-detail.diagram-node, .diagram-node.op-detail { border-left-color: #d9d9d9; background: #fafafa; }
    </style>

    <script>
        const { createApp, ref, computed, watch, onMounted } = Vue;

        createApp({
            setup() {
                // 从 sessionStorage 恢复：菜单跳转/F5 后 SQL、视图页签与上次结果不丢失
                const savedInput = PageState.get('explain-input') || {};
                const savedResult = PageState.get('explain-result') || {};
                const sql = ref(savedInput.sql || '');
                const result = ref(savedResult.result || null);
                const restoredAt = ref(result.value ? (savedResult.savedAt || null) : null);
                const savedAtText = computed(() => PageState.formatTime(restoredAt.value));
                const loading = ref(false);
                const dsConnected = ref(false);
                const dsInfo = ref('');
                const activeTab = ref(savedResult.activeTab || 'table');

                watch(sql, () => PageState.set('explain-input', { sql: sql.value }));
                watch(activeTab, persistResult);
                function persistResult() {
                    PageState.set('explain-result', {
                        result: result.value, activeTab: activeTab.value, savedAt: Date.now()
                    });
                }

                const fetchStatus = async () => {
                    try {
                        const resp = await axios.get('/api/status');
                        if (resp.data.code === 200) {
                            dsConnected.value = resp.data.data.dataSourceConnected;
                            dsInfo.value = resp.data.data.dataSourceInfo || '';
                        }
                    } catch (e) { /* 忽略 */ }
                };

                // 把 ExplainRow.columns 展平成 el-table 可用的行对象
                const tableData = computed(() => {
                    if (!result.value || !result.value.rows) return [];
                    return result.value.rows.map(row => {
                        const obj = {};
                        for (const key in row.columns) {
                            obj[key] = row.columns[key];
                        }
                        return obj;
                    });
                });

                // 根据操作/访问类型判定节点类别（用于着色）
                const classifyKind = (op, accessType) => {
                    const a = (accessType || '').toLowerCase();
                    const o = (op || '').toLowerCase();
                    // 全表扫描（MySQL 8 新格式：operation="Table scan on x"、access_type="table"；旧格式 access_type="ALL"）
                    if (a === 'all' || (o.includes('table scan') && !o.includes('index'))) return 'scan-full';
                    // 索引查找/扫描（良好）
                    if (o.includes('index lookup') || o.includes('index scan') || o.includes('index range')
                        || a === 'ref' || a === 'eq_ref' || a === 'range' || a === 'const' || a === 'system' || a === 'index') return 'index';
                    // 连接
                    if (o.includes('nested loop') || o.includes('hash join') || o.includes('join') || a === 'join') return 'join';
                    // 排序
                    if (o.includes('sort') || o.includes('order') || a === 'sort') return 'sort';
                    // 聚合/分组
                    if (o.includes('aggregate') || o.includes('group') || o.includes('distinct')) return 'agg';
                    // 过滤（中性弱化）
                    if (o.includes('filter') || a === 'filter') return 'detail';
                    return 'op';
                };

                // 从完整 operation 文本提取简短操作类型（用于彩色标签）
                const shortOp = (op) => {
                    const o = (op || '');
                    if (/nested loop/i.test(o)) return 'Nested Loop';
                    if (/hash join/i.test(o)) return 'Hash Join';
                    if (/index lookup/i.test(o)) return 'Index Lookup';
                    if (/single-row index/i.test(o)) return 'Index Lookup';
                    if (/index scan/i.test(o)) return 'Index Scan';
                    if (/index range/i.test(o)) return 'Index Range';
                    if (/table scan/i.test(o)) return 'Table Scan';
                    if (/covering index/i.test(o)) return 'Covering Index';
                    if (/^sort/i.test(o)) return 'Sort';
                    if (/^filter/i.test(o)) return 'Filter';
                    if (/aggregate/i.test(o)) return 'Aggregate';
                    if (/group/i.test(o)) return 'Group';
                    if (/limit/i.test(o)) return 'Limit';
                    // 取第一个词
                    const m = o.match(/^([A-Za-z][A-Za-z\- ]*?)(?=:| on | using |$)/);
                    return m ? m[1].trim() : (o.length > 20 ? o.slice(0, 20) : o);
                };

                // 把后端 PlanNode 转成展示节点（树/图/表格共用）
                let _uid = 0;
                const toDisplay = (n) => {
                    const kind = classifyKind(n.operation, n.accessType);
                    const metricParts = [];
                    if (n.rows != null) metricParts.push('rows=' + n.rows);
                    if (n.cost) metricParts.push('cost=' + Number(n.cost).toFixed(2));
                    return {
                        id: 'p' + (_uid++),
                        op: shortOp(n.operation),
                        text: n.operation || n.detail || '',
                        metric: metricParts.join('  '),
                        kind,
                        // 表格视图用的原始字段
                        operation: n.operation || '',
                        object: n.tableName || (n.key ? ('索引 ' + n.key) : ''),
                        rows: n.rows,
                        cost: n.cost != null ? Number(n.cost) : null,
                        nodeType: shortOp(n.operation),
                        accessType: n.accessType || '',
                        label: n.operation || n.detail || '',
                        children: (n.children || []).map(toDisplay)
                    };
                };

                // 计划树：优先用后端结构化 planTree
                const planTree = computed(() => {
                    _uid = 0;
                    const r = result.value;
                    if (!r || !r.planTree || r.planTree.length === 0) return [];
                    return r.planTree.map(toDisplay);
                });

                // 是否有结构化树可展示（MySQL FORMAT=JSON 才有）
                const hasTree = computed(() => planTree.value.length > 0);

                // 调试用：原始输出转储（表头 + 每行原始数据 + JSON）
                const rawDump = computed(() => {
                    const r = result.value;
                    if (!r) return '';
                    let out = '=== 数据库类型 ===\n' + (r.dbType || '未知') + '\n\n';
                    out += '=== 表头 (headers) ===\n' + JSON.stringify(r.headers) + '\n\n';
                    out += '=== 数据行 (rows) ===\n';
                    (r.rows || []).forEach((row, i) => {
                        out += '行' + (i + 1) + ': ' + JSON.stringify(row.columns) + '\n';
                    });
                    out += '\n=== rawPlan (文本) ===\n' + (r.rawPlan || '(空)') + '\n\n';
                    out += '=== rawJson (FORMAT=JSON) ===\n' + (r.rawJson || '(无)') + '\n';
                    return out;
                });

                // 图形视图：把树拍平成带 depth 的列表
                const flatNodes = computed(() => {
                    const out = [];
                    const walk = (nodes, depth) => {
                        nodes.forEach(n => {
                            out.push({ ...n, depth });
                            if (n.children && n.children.length) walk(n.children, depth + 1);
                        });
                    };
                    walk(planTree.value, 0);
                    return out;
                });

                // 表格视图：把计划树拍平成带层级缩进的行（Operation/Object/Rows/Cost/Node Type）
                const planRows = computed(() => {
                    const out = [];
                    const walk = (nodes, depth) => {
                        nodes.forEach(n => {
                            out.push({
                                id: n.id,
                                depth,
                                indent: '  '.repeat(depth) + (depth > 0 ? '└─ ' : ''),
                                operation: n.operation,
                                object: n.object || '—',
                                rows: n.rows != null ? n.rows : '—',
                                cost: n.cost != null ? n.cost.toFixed(2) : '—',
                                nodeType: n.nodeType,
                                kind: n.kind
                            });
                            if (n.children && n.children.length) walk(n.children, depth + 1);
                        });
                    };
                    walk(planTree.value, 0);
                    return out;
                });

                const doExplain = async () => {
                    if (!sql.value.trim()) {
                        ElementPlus.ElMessage.warning('请输入 SQL 语句');
                        return;
                    }
                    loading.value = true;
                    try {
                        const resp = await axios.post('/api/explain', { sql: sql.value });
                        if (resp.data.code === 200) {
                            result.value = resp.data.data;
                            restoredAt.value = null;
                            persistResult();
                            ElementPlus.ElMessage.success('执行计划分析完成');
                        } else {
                            ElementPlus.ElMessage.error(resp.data.message || '分析失败');
                        }
                    } catch (e) {
                        ElementPlus.ElMessage.error('分析失败: ' + (e.response?.data?.message || e.message));
                    } finally {
                        loading.value = false;
                    }
                };

                const costLevelText = (level) => {
                    switch (level) {
                        case 'HIGH': return '偏高';
                        case 'MEDIUM': return '中等';
                        case 'LOW': return '较低';
                        default: return '未知';
                    }
                };

                const tagText = (status) => {
                    if (status === 'EXISTS') return '已存在';
                    if (status === 'MISSING') return '建议创建';
                    return '未核实';
                };

                const copyText = async (text) => {
                    if (!text) return;
                    try {
                        await navigator.clipboard.writeText(text);
                        ElementPlus.ElMessage.success('已复制到剪贴板');
                    } catch (e) {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        ElementPlus.ElMessage.success('已复制到剪贴板');
                    }
                };

                const goDataSource = () => { window.location.href = '/datasource.html'; };
                const clearAll = () => {
                    sql.value = '';
                    result.value = null;
                    restoredAt.value = null;
                    PageState.remove('explain-input');
                    PageState.remove('explain-result');
                };

                onMounted(() => {
                    fetchStatus();
                    // 移动端菜单控制：点击展开/收起，按钮图标联动切换
                    const menuBtn = document.getElementById('mobileMenuBtn');
                    const sidebar = document.querySelector('.sidebar');
                    const overlay = document.getElementById('menuOverlay');

                    if (menuBtn && sidebar && overlay) {
                        const setMenu = (open) => {
                            sidebar.classList.toggle('mobile-open', open);
                            overlay.style.display = open ? 'block' : 'none';
                            menuBtn.innerHTML = open ? '✕ 关闭' : '☰ 菜单';
                        };
                        menuBtn.addEventListener('click', () => setMenu(!sidebar.classList.contains('mobile-open')));
                        overlay.addEventListener('click', () => setMenu(false));
                        sidebar.querySelectorAll('.menu-item').forEach(a =>
                            a.addEventListener('click', () => setMenu(false)));
                    }
                });

                return { sql, result, loading, dsConnected, dsInfo, tableData,
                    activeTab, planTree, planRows, flatNodes, hasTree, rawDump,
                    restoredAt, savedAtText,
                    doExplain, costLevelText, tagText, copyText, goDataSource, clearAll };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
