<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2311998e'/%3E%3Cstop offset='1' stop-color='%2338ef7d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='8' y='10' width='48' height='44' rx='6' fill='url(%23g)'/%3E%3Cpath d='M18 40 L28 28 L36 34 L46 20' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <title>SQL优化工具 - 打赏支持</title>
    <link rel="stylesheet" href="/libs/element-plus.index.css">
    <link rel="stylesheet" href="/common.css">
    <script src="/libs/vue.global.prod.js"></script>
    <script src="/libs/element-plus.index.full.min.js"></script>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1>SQL优化工具</h1>
                    <p>智能索引建议与执行计划分析</p>
                </div>
                <nav class="menu">
                    <a href="/manual.html" class="menu-item">
                        <span class="menu-icon">✏️</span><span>手工优化</span>
                    </a>
                    <a href="/auto.html" class="menu-item">
                        <span class="menu-icon">🔍</span><span>扫描优化</span>
                    </a>
                    <a href="/explain.html" class="menu-item">
                        <span class="menu-icon">📊</span><span>SQL执行计划</span>
                    </a>
                    <a href="/datasource.html" class="menu-item">
                        <span class="menu-icon">🔗</span><span>配置数据源</span>
                    </a>
                    <a href="/donate.html" class="menu-item active">
                        <span class="menu-icon">☕</span><span>打赏支持</span>
                    </a>
                </nav>
            </aside>

            <main class="main-content">
                <div class="page-header">
                    <h2>打赏支持</h2>
                    <p>你的支持是项目持续维护的动力 ❤️</p>
                </div>

                <div class="content-card" style="max-width:520px;text-align:center;">
                    <div style="font-size:16px;color:#333;line-height:1.8;margin-bottom:20px;">
                        如果这个项目对你有帮助，欢迎请我喝杯咖啡 ☕
                    </div>
                    <img src="/image/ds.png" alt="打赏二维码"
                         style="max-width:280px;width:100%;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.12);"
                         onerror="this.style.display='none';document.getElementById('img-fallback').style.display='block';">
                    <div id="img-fallback" style="display:none;color:#999;font-size:13px;padding:40px;border:1px dashed #ddd;border-radius:12px;">
                        二维码图片未找到，请将图片放置于 <code>resources/static/image/ds.png</code>
                    </div>
                    <div style="margin-top:24px;padding-top:20px;border-top:1px solid #f0f0f0;">
                        <div style="font-size:15px;color:#333;margin-bottom:12px;">
                            ⭐ 觉得好用的话，也欢迎给项目点个 Star 支持一下！
                        </div>
                        <el-button type="primary" size="large" @click="goStar">⭐ 前往点亮 Star</el-button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            setup() {
                const repoUrl = 'https://github.com/vfaner/sql-optimizer-tool';
                const goStar = () => window.open(repoUrl, '_blank');
                return { goStar };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
