<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2311998e'/%3E%3Cstop offset='1' stop-color='%2338ef7d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='8' y='10' width='48' height='44' rx='6' fill='url(%23g)'/%3E%3Cpath d='M18 40 L28 28 L36 34 L46 20' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <title>SQL优化工具 - 打赏支持</title>
    <link rel="stylesheet" href="/libs/element-plus.index.css">
    <link rel="stylesheet" href="/common.css">
    <script src="/libs/vue.global.prod.js"></script>
    <script src="/libs/element-plus.index.full.min.js"></script>
    <script src="/sidebar.js"></script>
    <script src="/menu-groups.js"></script>
    <script src="/auth.js"></script>
</head>
<body>
    <div id="app">
        <!-- 移动端汉堡菜单按钮（z-index 高于菜单与遮罩，展开后仍可点击关闭） -->
        <div id="mobileMenuBar" style="display:none;justify-content:space-between;align-items:center;width:100%;background:#0f2027;color:white;padding:12px;position:fixed;top:0;left:0;right:0;z-index:1002;">
            <div style="font-weight:bold;">MuOpt - SQL优化与信创转换</div>
            <button id="mobileMenuBtn" style="background:none;border:1px solid rgba(255,255,255,0.2);color:white;padding:8px 12px;border-radius:6px;margin-left:auto;">
                ☰ 菜单
            </button>
        </div>

        <!-- 移动端遮罩层 -->
        <div id="menuOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;"></div>

        <!-- 左侧菜单 -->
        <aside id="sidebar" class="sidebar"></aside>

        <div class="app-container">
            <main class="main-content">
                <div class="page-header">
                    <h2>打赏支持</h2>
                    <p>你的支持是项目持续维护的动力 ❤️</p>
                </div>

                <div class="content-card" style="max-width:520px;margin-left:auto;margin-right:auto;text-align:center;">
                    <div style="font-size:16px;color:#333;line-height:1.8;margin-bottom:20px;">
                        如果这个项目对你有帮助，欢迎请我喝杯咖啡 ☕
                    </div>

                    <div style="margin-bottom:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
                        <el-button :type="payType === 'wechat' ? 'primary' : 'default'" size="large" @click="switchPay('wechat')">微信</el-button>
                        <el-button :type="payType === 'alipay' ? 'primary' : 'default'" size="large" @click="switchPay('alipay')">支付宝</el-button>
                        <el-button :type="payType === 'qq' ? 'primary' : 'default'" size="large" @click="switchPay('qq')">QQ</el-button>
                    </div>

                    <img :src="payQr" :alt="payTip"
                         style="max-width:420px;width:100%;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.12);object-fit:contain;">
                    <div style="margin-top:16px;font-size:14px;color:#666;">{{ payTip }}</div>

                    <div style="margin-top:24px;padding-top:20px;border-top:1px solid #f0f0f0;">
                        <div style="font-size:15px;color:#333;margin-bottom:12px;">
                            ⭐ 觉得好用的话，也欢迎给项目点个 Star 支持一下！
                        </div>
                        <el-button type="primary" size="large" @click="goStar">⭐ 前往点亮 Star</el-button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        createApp({
            setup() {
                const repoUrl = 'https://github.com/vfaner/muopt';
                const goStar = () => window.open(repoUrl, '_blank');

                // 打赏支付方式：微信 / 支付宝 / QQ，切换时联动更新二维码与提示文字
                const payType = ref('wechat');
                const payOptions = {
                    wechat: { img: '/image/wechat.webp', tip: '用微信扫一扫' },
                    alipay: { img: '/image/alipay.webp', tip: '用支付宝扫一扫' },
                    qq: { img: '/image/qq.webp', tip: '用 QQ 扫一扫' }
                };
                const payQr = computed(() => payOptions[payType.value].img);
                const payTip = computed(() => payOptions[payType.value].tip);
                const switchPay = (type) => { payType.value = type; };

                onMounted(() => {
                });

                return { goStar, payType, payQr, payTip, switchPay };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
