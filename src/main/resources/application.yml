server:
  port: 8090
  # 本工具可浏览服务器目录并原地改写源文件，默认只监听本机回环地址。
  # 如确需局域网访问，请自行改为 0.0.0.0 并在前置网关上加鉴权。
  address: 127.0.0.1

spring:
  web:
    resources:
      static-locations: classpath:/static/

  # 配置库：保存多个数据库连接与 AI 模型配置（H2 文件库）。
  # 文件位置默认 ./data（相对于启动时的工作目录），可用环境变量
  # APP_DATA_DIR 指向固定绝对路径，避免不同启动方式各建一份库。
  datasource:
    url: jdbc:h2:file:${app.data.dir}/sql-optimizer;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: sql-optimizer-meta
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# 数据库密码 / AI API Key 落库加密口令（生产环境请通过环境变量覆盖）
app:
  # 配置库目录（数据库连接、AI 模型都保存在这里），默认 ./data，可用 APP_DATA_DIR 覆盖为绝对路径
  data:
    dir: ${APP_DATA_DIR:./data}
  crypto:
    password: ${APP_CRYPTO_PASSWORD:sql-optimizer-default-key-change-me}
    salt: ${APP_CRYPTO_SALT:7d2f91a4c6b80e3f}
  ai:
    # 扫描优化时 AI 改写的并发度、总等待时限、单请求超时上限（秒）；
    # 到总时限未完成的条目保留本地规则分析。扫描为服务端后台任务，可随时调大时限。
    scan-concurrency: ${APP_AI_SCAN_CONCURRENCY:8}
    scan-timeout-seconds: ${APP_AI_SCAN_TIMEOUT:120}
    scan-per-request-timeout-seconds: ${APP_AI_SCAN_PER_REQUEST_TIMEOUT:45}

logging:
  level:
    com.sqloptimizer: DEBUG
  file:
    name: logs/sql-optimizer.log
