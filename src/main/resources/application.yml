server:
  port: 8080
  # 本工具可浏览服务器目录并原地改写源文件，默认只监听本机回环地址。
  # 如确需局域网访问，请自行改为 0.0.0.0 并在前置网关上加鉴权。
  address: 127.0.0.1

spring:
  web:
    resources:
      static-locations: classpath:/static/

  # 配置库：保存多个数据库连接与 AI 模型配置（H2 文件库）。
  # 文件位置默认 ./data（相对于启动时的工作目录），可用环境变量
  # APP_DATA_DIR 指向固定绝对路径，避免不同启动方式各建一份库。
  # 库文件名已由 sql-optimizer 更名为 muopt；旧库文件由 LegacyDataMigration
  # 在启动时（DataSource 创建前）自动改名迁移，老用户升级不丢配置。
  datasource:
    url: jdbc:h2:file:${app.data.dir}/muopt;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: muopt-meta
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# 数据库密码 / AI API Key 落库加密口令（生产环境请通过环境变量覆盖）
app:
  # 当前版本号：构建时由 Maven resource filtering 注入 pom.xml 的 <version>（@...@ 为
  # spring-boot-starter-parent 约定的过滤占位符），仍允许 APP_VERSION 环境变量覆盖。
  # 版本号只在 pom.xml 一处维护，避免双处硬编码漏同步。
  version: ${APP_VERSION:@project.version@}
  # 配置库目录（数据库连接、AI 模型都保存在这里），默认 ./data，可用 APP_DATA_DIR 覆盖为绝对路径
  data:
    dir: ${APP_DATA_DIR:./data}
  crypto:
    # 注意：默认口令是密钥推导材料，老库里已加密的数据源密码 / AI Key 都依赖它，
    # 改名会导致升级后全部无法解密——保留历史值，勿随产品更名同步改动。
    password: ${APP_CRYPTO_PASSWORD:sql-optimizer-default-key-change-me}
    salt: ${APP_CRYPTO_SALT:7d2f91a4c6b80e3f}
  ai:
    # 扫描优化时 AI 改写的并发度、总等待时限、单请求超时上限（秒）；
    # 到总时限未完成的条目保留本地规则分析。扫描为服务端后台任务，可随时调大时限。
    scan-concurrency: ${APP_AI_SCAN_CONCURRENCY:8}
    scan-timeout-seconds: ${APP_AI_SCAN_TIMEOUT:120}
    scan-per-request-timeout-seconds: ${APP_AI_SCAN_PER_REQUEST_TIMEOUT:45}
    # 访问 AI 端点的 HTTP 代理（公司内网直连外网超时时配置），形如 http://127.0.0.1:7890；
    # 留空时自动使用标准环境变量 HTTPS_PROXY / HTTP_PROXY，本机地址始终直连
    proxy: ${APP_AI_PROXY:}

logging:
  file:
    name: logs/muopt.log
